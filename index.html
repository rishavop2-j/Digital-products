<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Soda Shop 3D - Rishav Kumar Vishwakarma</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;font-family:sans-serif;margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#87ceeb}
#c{width:100%;height:100%;display:block;position:fixed;inset:0;z-index:1}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;z-index:10;pointer-events:none}
.card{background:rgba(15,23,42,.88);color:#fff;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:13px;pointer-events:auto}
.banner{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff;padding:5px 12px;border-radius:10px;text-align:center}
.banner h1{font-size:14px;text-transform:uppercase}.banner p{font-size:10px}
#menu{position:fixed;right:10px;top:65px;display:flex;flex-direction:column;gap:8px;z-index:10}
.btn{background:#2563eb;color:#fff;border:2px solid rgba(255,255,255,.3);padding:9px 12px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.btn.org{background:#d97706}.btn.grn{background:#059669}.btn.red{background:#dc2626}
#joy{position:fixed;bottom:22px;left:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.4);z-index:10;touch-action:none}
#knob{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:#2563eb;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none}
#fBar{position:fixed;bottom:20px;right:12px;background:rgba(15,23,42,.95);padding:10px;border-radius:12px;border:2px solid #10b981;color:#fff;z-index:15;display:none;flex-direction:column;gap:6px;width:205px}
.fRow{display:flex;gap:5px}.fRow button{flex:1;padding:7px;border:none;border-radius:6px;font-weight:700;color:#fff;font-size:11px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;z-index:30;padding:12px}
.mbox{background:#1e293b;color:#fff;width:100%;max-width:400px;max-height:80vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:12px 15px;background:#0f172a;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.mbody{padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.item{background:#334155;padding:9px 11px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item h4{font-size:13px;margin-bottom:2px}.item p{font-size:11px;color:#cbd5e1}
.buy{background:#10b981;color:#fff;border:none;padding:7px 11px;border-radius:7px;font-weight:700;font-size:11px;cursor:pointer}
#lbls{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.wlbl{position:absolute;transform:translate(-50%,-50%);background:rgba(15,23,42,.82);color:#fff;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lbls"></div>

<div id="hud">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <div class="card">💵 ₹<span id="mTxt">150</span></div>
    <div class="card">📦 <span id="cTxt">0/3 (Empty)</span></div>
    <div class="card">🥤 <span id="bTxt" style="color:#ff6b6b">Roka Rola</span></div>
  </div>
  <div class="banner"><h1>🥤 My Soda Shop 3D</h1><p>Dev: Rishav Kumar Vishwakarma</p></div>
</div>

<div id="menu">
  <button class="btn" onclick="openM('upM')">⚡ Upgrades & Staff</button>
  <button class="btn org" onclick="openM('brM')">🥤 Brands & Expand</button>
  <button class="btn grn" onclick="toggleF()">🪑 Furniture (<span id="fCnt">1/3</span>)</button>
  <button class="btn red" onclick="emptyH()">🗑️ Empty Hand</button>
</div>

<div id="joy"><div id="knob"></div></div>

<div id="fBar">
  <b style="font-size:12px;color:#34d399">🪑 Place Furniture Anywhere</b>
  <div class="fRow">
    <button style="background:#10b981" onclick="placeF()">✅ Place</button>
    <button style="background:#3b82f6" onclick="rotF()">🔄 Rotate</button>
  </div>
  <div class="fRow">
    <button style="background:#f59e0b" onclick="pickF()">📥 Pick Up</button>
    <button style="background:#ef4444" onclick="toggleF()">✖ Close</button>
  </div>
</div>

<div class="modal" id="upM"><div class="mbox"><div class="mhead"><span>⚡ Upgrades & Staff</span><button class="buy" style="background:#ef4444" onclick="closeM('upM')">X</button></div><div class="mbody" id="upList"></div></div></div>
<div class="modal" id="brM"><div class="mbox"><div class="mhead"><span>🥤 Soda Brands & Expand</span><button class="buy" style="background:#ef4444" onclick="closeM('brM')">X</button></div><div class="mbody" id="brList"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const BRANDS=[
  {id:0,n:"Roka Rola",p:15,c:0,col:0xe11d48,hex:"#ff6b6b",u:true},
  {id:1,n:"Thumbs Down",p:25,c:150,col:0x4b5563,hex:"#9ca3af",u:false},
  {id:2,n:"Aprite",p:40,c:350,col:0x10b981,hex:"#34d399",u:false},
  {id:3,n:"Jampa Cola",p:60,c:700,col:0xf97316,hex:"#fb923c",u:false},
  {id:4,n:"Mimca",p:90,c:1200,col:0x84cc16,hex:"#a3e635",u:false},
  {id:5,n:"Bluebull",p:140,c:2200,col:0x2563eb,hex:"#60a5fa",u:false}
];

const S={money:150,brand:0,spdLv:1,spd:9,capLv:1,maxCap:3,hand:[],fBag:1,maxFBag:3,fLv:1,emp:{farmer:0,labour:0,cashier:0},expLv:1,fMode:false,fRot:0};

// THREE.JS 3D INIT
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,150);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

scene.add(new THREE.AmbientLight(0xffffff,0.75));
const sun=new THREE.DirectionalLight(0xfffbeb,0.85);
sun.position.set(15,30,20);
scene.add(sun);

function box(w,h,d,col,x,y,z,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z);parent.add(m);return m;
}

const lblBox=document.getElementById('lbls'),wLbls=[];
function addLbl(txt,x,y,z,bg="rgba(15,23,42,.85)"){
  const d=document.createElement('div');d.className='wlbl';d.style.background=bg;d.innerHTML=txt;
  lblBox.appendChild(d);const o={d,v:new THREE.Vector3(x,y,z)};wLbls.push(o);return o;
}

// 4 LOCATIONS FLOORS & WALLS
const fFarm=box(24,0.4,11,0x16a34a,0,-0.2,-20.5);
const fFact=box(24,0.4,10,0x475569,0,-0.2,-10);
const fGodown=box(24,0.4,9,0x92400e,0,-0.2,-0.5);
const fShop=box(24,0.4,16,0xf1f5f9,0,-0.2,12);
box(40,0.3,8,0x334155,0,-0.25,24); // Road

[-15,-5,4].forEach((z,i)=>{
  const c=[0x94a3b8,0xd97706,0x3b82f6][i];
  box(8,2.2,0.4,c,-8,1.1,z);box(8,2.2,0.4,c,8,1.1,z);
});
const wallL=box(0.5,2.5,46,0x64748b,-12,1.25,-2),wallR=box(0.5,2.5,46,0x64748b,12,1.25,-2);

addLbl("🌾 4. FARM (Ingredients)",0,3.2,-23,"#15803d");
addLbl("🏭 3. SODA FACTORY",0,3.2,-13,"#334155");
addLbl("📦 2. GODOWN (Storage)",0,3.2,-3.5,"#78350f");
addLbl("🏪 1. MAIN SHOWROOM",0,3.2,6,"#2563eb");

// FARM CROPS
const plots=[-6,-2,2,6].map(x=>{
  box(2.4,0.3,2.4,0x451a03,x,0.15,-21);
  return {x,z:-21,ok:true,t:0,m:box(1.3,1.3,1.3,0x84cc16,x,0.9,-21)};
});

// FACTORY MACHINE
const fact={inX:-4.5,inZ:-10,outX:4.5,outZ:-10,raw:0,soda:0,prog:0};
box(2.5,0.2,2.5,0xf59e0b,fact.inX,0.1,fact.inZ);
const boiler=box(4,2.8,2.8,0xe11d48,0,1.4,-10);
const topCan=box(1.2,1.6,1.2,0xffffff,0,3.4,-10);
box(2.5,0.2,2.5,0x10b981,fact.outX,0.1,fact.outZ);
const fInL=addLbl("📥 Ingredients (0)",fact.inX,2.2,fact.inZ);
const fOutL=addLbl("📤 Soda (0)",fact.outX,2.2,fact.outZ);

// GODOWN & TRASH
const gRack={x:-5,z:-0.5,items:[],max:15};
box(3.5,2.2,2,0x78350f,gRack.x,1.1,gRack.z);
const gLbl=addLbl("📦 Godown (0/15)",gRack.x,2.8,gRack.z);
box(1.5,1.4,1.5,0xef4444,6,0.7,-0.5);
addLbl("🗑️ Trash",6,2,-0.5,"#dc2626");

// CASH COUNTER
const cnt={x:-5.5,z:15,cash:0,t:0};
box(3.8,1.3,2,0x1e40af,cnt.x,0.65,cnt.z);
box(2,0.1,2,0x60a5fa,cnt.x,0.05,cnt.z-2);
box(2.2,0.15,2.2,0x22c55e,cnt.x+3.2,0.08,cnt.z);
addLbl("💳 Billing Counter",cnt.x,2.3,cnt.z);
const cashL=addLbl("💵 Cash: ₹0",cnt.x+3.2,1.8,cnt.z,"#16a34a");

// FRIDGES (PLACE ANYWHERE)
const fridges=[];
function addFridge(x,z,rot=0){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;
  box(2.6,2.6,1.4,0x0284c7,0,1.3,0,g);
  box(2.2,2,0.15,0xe0f2fe,0,1.3,0.7,g);
  scene.add(g);
  const l=addLbl("🧊 Fridge (0/8)",x,3.1,z,"#0284c7");
  fridges.push({x,z,rot,g,items:[],max:8,l});
}
addFridge(4.5,11,0);

const ghost=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,1.4),new THREE.MeshBasicMaterial({color:0x10b981,transparent:true,opacity:0.5}));
ghost.position.y=1.3;ghost.visible=false;scene.add(ghost);

// 3D CHARACTERS
function makeChar(col){
  const g=new THREE.Group();
  box(0.5,0.6,0.4,0x1e293b,-0.22,0.3,0,g); // Left Leg
  box(0.5,0.6,0.4,0x1e293b,0.22,0.3,0,g);  // Right Leg
  box(1,1.1,0.6,col,0,1.15,0,g);            // Torso
  box(0.7,0.7,0.7,0xfde047,0,2.1,0,g);      // Head
  const st=new THREE.Group();st.position.set(0,1.2,0.65);g.add(st);
  scene.add(g);return {g,st};
}
function drawStack(st,list){
  while(st.children.length)st.remove(st.children[0]);
  list.forEach((it,i)=>{
    const c=it.t==='ing'?0x84cc16:BRANDS[it.b].col;
    box(0.8,0.36,0.6,c,0,i*0.4,0,st);
  });
}

const pChar=makeChar(0xff416c);pChar.g.position.set(0,0,8);
const pLbl=addLbl("👑 YOU (Rishav)",0,2.9,8,"#e11d48");

// JOYSTICK & KEYS
const joy={x:0,y:0},keys={};
window.onkeydown=e=>keys[e.key.toLowerCase()]=true;
window.onkeyup=e=>keys[e.key.toLowerCase()]=false;
const jZone=document.getElementById('joy'),jKnob=document.getElementById('knob');
let jAct=false;
function moveJ(cx,cy){
  const r=jZone.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
  let dx=cx-ox,dy=cy-oy,d=Math.hypot(dx,dy),m=r.width/2-20;
  if(d>m){dx=dx/d*m;dy=dy/d*m;}
  jKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  joy.x=dx/m;joy.y=dy/m;
}
jZone.onpointerdown=e=>{jAct=true;jZone.setPointerCapture(e.pointerId);moveJ(e.clientX,e.clientY)};
jZone.onpointermove=e=>{if(jAct)moveJ(e.clientX,e.clientY)};
jZone.onpointerup=jZone.onpointercancel=()=>{jAct=false;joy.x=0;joy.y=0;jKnob.style.transform='translate(-50%,-50%)'};

// WORKERS & CUSTOMERS
const workers=[],custs=[];let cTimer=0;
function addWorker(role){
  const col={farmer:0x16a34a,labour:0xf59e0b,cashier:0x8b5cf6}[role];
  const ch=makeChar(col);
  const x=role==='cashier'?cnt.x:0,z=role==='farmer'?-18:(role==='labour'?-6:cnt.z-2);
  ch.g.position.set(x,0,z);
  const l=addLbl({farmer:"👨‍🌾 Farmer",labour:"👷 Labour",cashier:"🧑‍💼 Cashier"}[role],x,2.8,z);
  workers.push({role,ch,l,hand:[]});
}
function stepTo(p,tx,tz,spd,dt){
  const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
  if(d<0.25)return true;
  p.x+=dx/d*spd*dt;p.z+=dz/d*spd*dt;return false;
}

// UI ACTIONS
function syncUI(){
  document.getElementById('mTxt').innerText=Math.floor(S.money);
  const hTxt=S.hand.length?`${S.hand.length}/${S.maxCap} (${S.hand[0].t==='ing'?'Ingredients':BRANDS[S.hand[0].b].n})`:`0/${S.maxCap} (Empty)`;
  document.getElementById('cTxt').innerText=hTxt;
  const b=BRANDS[S.brand],bEl=document.getElementById('bTxt');
  bEl.innerText=b.n;bEl.style.color=b.hex;
  document.getElementById('fCnt').innerText=`${S.fBag}/${S.maxFBag}`;
}
function toggleF(){S.fMode=!S.fMode;document.getElementById('fBar').style.display=S.fMode?'flex':'none';ghost.visible=S.fMode;}
function rotF(){S.fRot+=Math.PI/2;ghost.rotation.y=S.fRot;}
function placeF(){
  if(S.fBag<=0)return alert("Furniture Bag khali hai! Brands menu se naya Fridge lein ya purana Pick Up karein.");
  addFridge(ghost.position.x,ghost.position.z,S.fRot);S.fBag--;syncUI();
}
function pickF(){
  if(fridges.length<=1)return alert("Shop mein kam se kam 1 Fridge zaroori hai!");
  if(S.fBag>=S.maxFBag)return alert("Furniture Bag full hai!");
  let idx=-1,best=6;
  fridges.forEach((f,i)=>{const d=Math.hypot(pChar.g.position.x-f.x,pChar.g.position.z-f.z);if(d<best){best=d;idx=i;}});
  if(idx<0)return alert("Fridge ke paas jaakar Pick Up dabayein!");
  const f=fridges[idx];scene.remove(f.g);f.l.d.remove();wLbls.splice(wLbls.indexOf(f.l),1);fridges.splice(idx,1);
  S.fBag++;syncUI();
}
function emptyH(){S.hand=[];drawStack(pChar.st,S.hand);syncUI();}
function openM(id){renderM();document.getElementById(id).style.display='flex';}
function closeM(id){document.getElementById(id).style.display='none';}

function renderM(){
  const sc=S.spdLv*80,cc=S.capLv*100,fc=S.fLv*120,c1=150+S.emp.cashier*200,c2=180+S.emp.farmer*200,c3=220+S.emp.labour*250;
  document.getElementById('upList').innerHTML=`
    <div class="item"><div><h4>🏃 Speed (Lv.${S.spdLv})</h4><p>Player walking speed badhayein</p></div><button class="buy" onclick="buyU('spd',${sc})">₹${sc}</button></div>
    <div class="item"><div><h4>💪 Carry Capacity (${S.maxCap})</h4><p>Zyada crates haath mein uthayein</p></div><button class="buy" onclick="buyU('cap',${cc})">₹${cc}</button></div>
    <div class="item"><div><h4>🎒 Furniture Bag (${S.maxFBag})</h4><p>Big furniture storage badhayein</p></div><button class="buy" onclick="buyU('fbag',${fc})">₹${fc}</button></div>
    <div class="item"><div><h4>🧑‍💼 Cashier (${S.emp.cashier})</h4><p>Auto customer billing</p></div><button class="buy" onclick="buyU('cashier',${c1})">₹${c1}</button></div>
    <div class="item"><div><h4>👨‍🌾 Farmer (${S.emp.farmer})</h4><p>Auto farm to factory</p></div><button class="buy" onclick="buyU('farmer',${c2})">₹${c2}</button></div>
    <div class="item"><div><h4>👷 Factory Labour (${S.emp.labour})</h4><p>Auto factory to shop fridge</p></div><button class="buy" onclick="buyU('labour',${c3})">₹${c3}</button></div>`;
  let bh=`
    <div class="item"><div><h4>🧊 Buy Extra Fridge</h4><p>Kahin bhi place karne ke liye</p></div><button class="buy" onclick="buyF(120)">₹120</button></div>
    <div class="item"><div><h4>🏗️ Expand Area (Lv.${S.expLv})</h4><p>Badi shop aur zyada customers</p></div><button class="buy" onclick="buyE(${S.expLv*300})">₹${S.expLv*300}</button></div>`;
  BRANDS.forEach(b=>{
    const btn=b.u?`<button class="buy" style="background:${S.brand===b.id?'#f59e0b':'#10b981'}" onclick="setB(${b.id})">${S.brand===b.id?'Active':'Select'}</button>`:`<button class="buy" onclick="unB(${b.id})">Unlock ₹${b.c}</button>`;
    bh+=`<div class="item"><div><h4 style="color:${b.hex}">🥤 ${b.n}</h4><p>Sell Price: ₹${b.p}</p></div>${btn}</div>`;
  });
  document.getElementById('brList').innerHTML=bh;
}
function buyU(t,c){
  if(S.money<c)return alert("Paise kam hain!");S.money-=c;
  if(t==='spd'){S.spdLv++;S.spd+=1.5;}if(t==='cap'){S.capLv++;S.maxCap+=2;}if(t==='fbag'){S.fLv++;S.maxFBag+=2;}
  if(['cashier','farmer','labour'].includes(t)){S.emp[t]++;addWorker(t);}
  syncUI();renderM();
}
function buyF(c){if(S.money<c||S.fBag>=S.maxFBag)return alert("Paise kam hain ya Bag full hai!");S.money-=c;S.fBag++;syncUI();renderM();}
function buyE(c){
  if(S.money<c)return alert("Paise kam hain!");S.money-=c;S.expLv++;
  const sx=1+(S.expLv-1)*0.2;[fFarm,fFact,fGodown,fShop].forEach(f=>f.scale.x=sx);
  wallL.position.x=-12*sx;wallR.position.x=12*sx;syncUI();renderM();
}
function unB(id){const b=BRANDS[id];if(S.money<b.c)return alert("Paise kam hain!");S.money-=b.c;b.u=true;setB(id);}
function setB(id){S.brand=id;boiler.material.color.setHex(BRANDS[id].col);syncUI();renderM();}

// MAIN 3D GAME LOOP
let last=performance.now(),cd=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.1);last=now;cd=Math.max(0,cd-dt);
  topCan.rotation.y+=dt*2;

  let mx=joy.x,mz=joy.y;
  if(keys.w||keys.arrowup)mz=-1;if(keys.s||keys.arrowdown)mz=1;
  if(keys.a||keys.arrowleft)mx=-1;if(keys.d||keys.arrowright)mx=1;
  const p=pChar.g.position;
  if(Math.hypot(mx,mz)>0.05){
    const l=Math.hypot(mx,mz),lim=11*(1+(S.expLv-1)*0.2);
    p.x=Math.max(-lim,Math.min(lim,p.x+(mx/l)*S.spd*dt));
    p.z=Math.max(-24,Math.min(23,p.z+(mz/l)*S.spd*dt));
    pChar.g.rotation.y=Math.atan2(mx,mz);
  }
  pLbl.v.set(p.x,2.9,p.z);
  if(S.fMode)ghost.position.set(p.x+Math.sin(pChar.g.rotation.y)*2.8,1.3,p.z+Math.cos(pChar.g.rotation.y)*2.8);

  camera.position.set(p.x*0.6,18,p.z+15);camera.lookAt(p.x*0.4,0,p.z-2);

  // Farm
  plots.forEach(pl=>{
    if(!pl.ok){pl.t+=dt;pl.m.scale.setScalar(Math.min(1,pl.t/3));if(pl.t>=3)pl.ok=true;}
    else if(Math.hypot(p.x-pl.x,p.z-pl.z)<2.2&&cd<=0&&S.hand.length<S.maxCap&&(!S.hand.length||S.hand[0].t==='ing')){
      pl.ok=false;pl.t=0;pl.m.scale.setScalar(0.1);S.hand.push({t:'ing'});drawStack(pChar.st,S.hand);syncUI();cd=0.2;
    }
  });

  // Factory
  if(fact.raw>0&&fact.soda<12){fact.prog+=dt;if(fact.prog>=1.6){fact.prog=0;fact.raw--;fact.soda++;}}
  fInL.d.innerHTML=`📥 Ingredients (${fact.raw})`;fOutL.d.innerHTML=`📤 ${BRANDS[S.brand].n} (${fact.soda})`;
  if(Math.hypot(p.x-fact.inX,p.z-fact.inZ)<2.3&&cd<=0&&S.hand.length&&S.hand[0].t==='ing'){
    S.hand.pop();fact.raw++;drawStack(pChar.st,S.hand);syncUI();cd=0.18;
  }
  if(Math.hypot(p.x-fact.outX,p.z-fact.outZ)<2.3&&cd<=0&&fact.soda>0&&S.hand.length<S.maxCap&&(!S.hand.length||S.hand[0].t==='soda')){
    fact.soda--;S.hand.push({t:'soda',b:S.brand});drawStack(pChar.st,S.hand);syncUI();cd=0.18;
  }

  // Godown & Trash
  if(Math.hypot(p.x-6,p.z+0.5)<2&&S.hand.length)emptyH();
  if(Math.hypot(p.x-gRack.x,p.z-gRack.z)<2.4&&cd<=0){
    if(S.hand.length&&S.hand[0].t==='soda'&&gRack.items.length<gRack.max){gRack.items.push(S.hand.pop());drawStack(pChar.st,S.hand);syncUI();cd=0.2;}
    else if(!S.hand.length&&gRack.items.length){S.hand.push(gRack.items.pop());drawStack(pChar.st,S.hand);syncUI();cd=0.2;}
  }
  gLbl.d.innerHTML=`📦 Godown (${gRack.items.length}/${gRack.max})`;

  // Fridges & Cash
  fridges.forEach(f=>{
    if(Math.hypot(p.x-f.x,p.z-f.z)<2.5&&cd<=0&&S.hand.length&&S.hand[0].t==='soda'&&f.items.length<f.max){
      f.items.push(S.hand.pop());drawStack(pChar.st,S.hand);syncUI();cd=0.18;
    }
    f.l.d.innerHTML=`🧊 Fridge (${f.items.length}/${f.max})`;
  });
  if(Math.hypot(p.x-(cnt.x+3.2),p.z-cnt.z)<2.4&&cnt.cash>0){S.money+=cnt.cash;cnt.cash=0;syncUI();}
  cashL.d.innerHTML=`💵 Cash: ₹${cnt.cash}`;

  // AI Workers
  workers.forEach(w=>{
    const wp=w.ch.g.position;
    if(w.role==='farmer'){
      if(!w.hand.length){const pl=plots.find(x=>x.ok);if(pl&&stepTo(wp,pl.x,pl.z,5.5,dt)){pl.ok=false;pl.t=0;w.hand.push({t:'ing'});drawStack(w.ch.st,w.hand);}}
      else if(stepTo(wp,fact.inX,fact.inZ,5.5,dt)){w.hand.pop();fact.raw++;drawStack(w.ch.st,w.hand);}
    }else if(w.role==='labour'){
      if(!w.hand.length){if(fact.soda>0&&stepTo(wp,fact.outX,fact.outZ,6,dt)){fact.soda--;w.hand.push({t:'soda',b:S.brand});drawStack(w.ch.st,w.hand);}}
      else{const f=fridges.find(x=>x.items.length<x.max)||fridges[0];if(f&&stepTo(wp,f.x,f.z,6,dt)&&f.items.length<f.max){f.items.push(w.hand.pop());drawStack(w.ch.st,w.hand);}}
    }
    w.l.v.set(wp.x,2.8,wp.z);
  });

  // Customers
  cTimer+=dt;
  if(cTimer>3.2&&custs.length<4+S.expLv*2&&fridges.length){
    cTimer=0;const ch=makeChar(0x38bdf8);ch.g.position.set((Math.random()-0.5)*12,0,25);
    custs.push({ch,st:'toF',f:fridges[Math.floor(Math.random()*fridges.length)],it:null});
  }
  const canBill=Math.hypot(p.x-cnt.x,p.z-(cnt.z-2))<2.5||S.emp.cashier>0;
  for(let i=custs.length-1;i>=0;i--){
    const c=custs[i],cp=c.ch.g.position;
    if(c.st==='toF'){if(!fridges.includes(c.f))c.f=fridges[0];if(c.f&&stepTo(cp,c.f.x,c.f.z+1.6,5,dt))c.st='waitS';}
    else if(c.st==='waitS'){if(c.f&&c.f.items.length){c.it=c.f.items.pop();drawStack(c.ch.st,[c.it]);c.st='toC';}}
    else if(c.st==='toC'){if(stepTo(cp,cnt.x,cnt.z+1.8,5,dt))c.st='waitB';}
    else if(c.st==='waitB'&&canBill){cnt.t+=dt;if(cnt.t>=0.6){cnt.t=0;cnt.cash+=BRANDS[c.it.b].p;drawStack(c.ch.st,[]);c.st='exit';}}
    else if(c.st==='exit'&&stepTo(cp,10,26,6,dt)){scene.remove(c.ch.g);custs.splice(i,1);}
  }

  wLbls.forEach(o=>{
    const v=o.v.clone().project(camera);
    o.d.style.display=v.z>1?'none':'block';
    o.d.style.left=`${(v.x*0.5+0.5)*window.innerWidth}px`;
    o.d.style.top=`${(-v.y*0.5+0.5)*window.innerHeight}px`;
  });
  renderer.render(scene,camera);
}
window.onresize=()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);};
syncUI();requestAnimationFrame(loop);
</script>
</body>
</html>
